name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Deploys main to Cloudflare once the tests pass. Needs the repository secrets
  # CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and WRANGLER_CONFIG (the full contents of your
  # wrangler.jsonc). Without them, for example on a fork, the job is skipped with a notice.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}
    steps:
      - id: configured
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$WRANGLER_CONFIG" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy: set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and WRANGLER_CONFIG to deploy main automatically."
          fi
      - if: steps.configured.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.configured.outputs.ok == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.configured.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - if: steps.configured.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.configured.outputs.ok == 'true'
        run: printf '%s\n' "$WRANGLER_CONFIG" > wrangler.jsonc
      - if: steps.configured.outputs.ok == 'true'
        run: pnpm db:migrate:remote
      - if: steps.configured.outputs.ok == 'true'
        run: pnpm run deploy
